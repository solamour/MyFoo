name: unitTest

on:
  workflow_call:

jobs:
  unitTest:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        buildVariants: [testDebugUnitTest]    # "testReleaseUnitTest" unavailable in recent AGP.
    steps:
      # https://github.com/actions/checkout
      - name: checkout
        uses: actions/checkout@v4

      - name: set up jdk
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: gradle

      - name: unitTest
        run: |
          chmod +x gradlew
          ./gradlew ${{ matrix.buildVariants }}
